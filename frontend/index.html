<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Inference</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Qwen2.5-0.5B</h1>
      <p class="subtitle">From-scratch inference engine · raw weights, hand-written transformer</p>
    </header>

    <div class="controls">
      <label class="control">
        Max tokens
        <input type="number" id="maxTokens" value="100" min="1" max="500">
      </label>
      <label class="control">
        Temperature
        <input type="range" id="temperature" min="0" max="1.5" step="0.1" value="0.7">
        <span class="value" id="tempValue">0.7</span>
      </label>
      <label class="control">
        Top-p
        <input type="range" id="topP" min="0" max="1" step="0.05" value="0.9">
        <span class="value" id="topPValue">0.9</span>
      </label>
    </div>

    <textarea id="prompt" rows="3" placeholder="Ask something...">What is the capital of Canada?</textarea>
    <button id="send">Generate</button>

    <div id="output" class="output"></div>
    <div id="status" class="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
